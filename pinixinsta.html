<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinixinsta Video Downloader</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }
body {
    background: linear-gradient(135deg, #971dd8, #f42baa);
    min-height: 100vh;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: auto;
}
.card {
    background: #fff;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}
h1 {
    text-align: center;
    margin-bottom: 20px;
}
input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #ddd;
}
button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    cursor: pointer;
}
.primary {
    background: #2563eb;
    color: #fff;
}
.primary:hover { background: #1e40af; }
.secondary {
    background: #16a34a;
    color: #fff;
}
.secondary:hover { background: #15803d; }
.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    font-weight: bold;
    text-align: center;
}
.success { background: #dcfce7; color: #166534; }
.error { background: #fee2e2; color: #7f1d1d; }
.info-box {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    display: none;
}
.info-box img {
    max-width: 100%;
    border-radius: 10px;
}
.small {
    font-size: 14px;
    color: #555;
    margin-top: 5px;
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<h1>🎬 Pinixinsta Downloader</h1>

<input id="videoUrl" placeholder="Paste any video link (YouTube, Instagram, TikTok, Facebook, X...)">

<button class="primary" onclick="fetchInfo()">Download</button>

<div class="status" id="status"></div>

<div class="info-box" id="infoBox">
    <h3 id="title"></h3>
    <p class="small">Platform: <span id="platform"></span></p>
    <img id="thumbnail">
    <button class="secondary" onclick="download()">⬇ Download Video</button>
</div>

</div>
</div>

<script>
// const API_BASE = 'http://localhost:3000';
const API_BASE = 'https://pinixista-backend-ko25.vercel.app';

function showStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = `status ${type}`;
    el.style.display = 'block';
}

async function fetchInfo() {
    const url = document.getElementById('videoUrl').value.trim();
    if (!url) {
        showStatus('❌ Please paste a video URL', 'error');
        return;
    }

    showStatus('⏳ Fetching video info...', 'success');

    try {
        const res = await fetch(`${API_BASE}/api/info`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!data.success) throw new Error();

        document.getElementById('title').textContent = data.data.title;
        document.getElementById('platform').textContent = data.data.platform;
        document.getElementById('thumbnail').src = data.data.thumbnail;

        document.getElementById('infoBox').style.display = 'block';
        showStatus('✅ Video ready to download', 'success');

    } catch {
        showStatus('❌ Failed to fetch video info', 'error');
        document.getElementById('infoBox').style.display = 'none';
    }
}

function download() {
    const url = document.getElementById('videoUrl').value.trim();
    if (!url) return;

    const downloadUrl =
        `${API_BASE}/api/download?url=${encodeURIComponent(url)}`;

    // trigger browser download
    window.location.href = downloadUrl;

    showStatus('⬇ Download started...', 'success');
}
</script>

</body>
</html>
